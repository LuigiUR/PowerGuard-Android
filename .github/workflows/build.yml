name: Compila APK Android

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Imposta JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Installa Gradle 8.7 e Compila APK
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /opt/gradle
          /opt/gradle/gradle-8.7/bin/gradle assembleDebug --no-daemon
      - name: Carica APK pronto
        uses: actions/upload-artifact@v4
        with:
          name: PowerGuard-App-APK
          path: app/build/outputs/apk/debug/app-debug.apk
